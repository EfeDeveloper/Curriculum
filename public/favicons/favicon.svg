<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1433;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b3d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff5722;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Circle background (navy) -->
  <circle cx="96" cy="96" r="94" fill="url(#bgGrad)"/>

  <!-- Circle border -->
  <circle cx="96" cy="96" r="95" fill="none" stroke="url(#textGrad)" stroke-width="2" opacity="0.6"/>

  <!-- EV - rounded sans-serif -->
  <text x="96" y="85" font-family="Verdana, sans-serif" font-size="92" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="url(#textGrad)" letter-spacing="-2">EV</text>

  <!-- Code: </> -->
  <text x="96" y="142" font-family="Courier New, monospace" font-size="62" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="url(#textGrad)">&lt;/&gt;</text>
</svg>
